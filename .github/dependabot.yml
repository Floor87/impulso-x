version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Tucuman
    target-branch: main
    open-pull-requests-limit: 5
    reviewers:
      - Floor87

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Argentina/Tucuman
    target-branch: main
    open-pull-requests-limit: 5
    reviewers:
      - Floor87
